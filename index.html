<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeToolsAI World</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script></head><body class="bg-white h-screen flex flex-col"><header class="h-12 bg-black text-white flex items-center justify-between px-3"><b>FreeToolsAI WORLD</b><div class="flex gap-2"><div id="earn" class="bg-green-500 px-3 py-1 rounded-full text-xs hidden">$<span id="amt">0</span></div><button id="lb" onclick="show()" class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold">Login</button></div></header><div id="log" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm"><h2 class="font-black">Join World</h2><p class="text-xs">Earn to ABL Bank!</p><input id="em" placeholder="Your Gmail" class="w-full border rounded-full px-3 py-2 text-sm mt-3"><input id="abl" placeholder="ABL IBAN: PK..." class="w-full border rounded-full px-3 py-2 text-sm mt-2"><input id="pay" placeholder="Payoneer Email" class="w-full border rounded-full px-3 py-2 text-sm mt-2"><button onclick="login()" class="w-full mt-3 bg-black text-white py-2 rounded-full text-sm font-bold">Create Account</button><button onclick="hide()" class="w-full mt-2 text-xs">Close</button></div></div><div class="flex flex-1 overflow-hidden"><div class="w-64 bg-white border-r p-3"><div class="bg-black text-white rounded-xl p-3 text-xs"><b>WORLD EARN</b><br>PK: Rs500→You Rs150<br>World: $10→You $3<br>Payout: ABL Bank</div><input id="ai" placeholder="Design idea..." class="w-full border rounded-full px-3 py-2 text-xs mt-3"><button onclick="gen()" class="w-full bg-black text-white py-2 rounded-full text-xs font-bold mt-2">AI Generate</button><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="addT()" class="border rounded-lg p-2 text-xs">Text</button><button onclick="addR()" class="border rounded-lg p-2 text-xs">Box</button><button onclick="clearC()" class="border rounded-lg p-2 text-xs">Clear</button><button onclick="sell()" class="bg-green-600 text-white rounded-lg p-2 text-xs font-bold">Sell</button></div><div class="mt-3 text-xs"><b>ABL:</b><div id="ablD" class="text-[10px] bg-zinc-50 p-2 rounded mt-1">Not set</div><b>Earn:</b><div id="myD" class="text-[10px] mt-1">Login</div></div></div><div class="flex-1 bg-zinc-100 flex items-center justify-center p-2"><div class="bg-white shadow-xl"><canvas id="c" width="550" height="320"></canvas></div></div></div><script>let canvas=new fabric.Canvas('c');canvas.setBackgroundColor('#fff',canvas.renderAll.bind(canvas));function show(){document.getElementById('log').classList.remove('hidden')}function hide(){document.getElementById('log').classList.add('hidden')}function login(){let e=document.getElementById('em').value;let a=document.getElementById('abl').value;let p=document.getElementById('pay').value;if(!e)return alert('Enter Gmail');localStorage.setItem('user',e);if(a)localStorage.setItem('abl',a);if(p)localStorage.setItem('pay',p);after(e)}function after(n){hide();document.getElementById('lb').classList.add('hidden');document.getElementById('earn').classList.remove('hidden');document.getElementById('ablD').innerHTML='ABL: '+(localStorage.getItem('abl')||'')+'<br>Raast: 03137855020';document.getElementById('myD').innerHTML='Welcome '+n}function addT(){canvas.add(new fabric.Textbox('World',{left:50,top:50,width:180,fontSize:20}))}function addR(){canvas.add(new fabric.Rect({left:80,top:80,width:100,height:60,fill:'#3b82f6'}))}function clearC(){canvas.clear();canvas.setBackgroundColor('#fff',canvas.renderAll.bind(canvas))}function gen(){let p=document.getElementById('ai').value;if(!p)return alert('Write idea');let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=400&height=400&seed=${Math.random()}&model=turbo&nologo=true`;fabric.Image.fromURL(u,i=>{i.scale(0.3);canvas.add(i)},{crossOrigin:'anonymous'})}function sell(){let u=localStorage.getItem('user');if(!u)return show();let e=parseInt(localStorage.getItem('earn')||0)+3;localStorage.setItem('earn',e);document.getElementById('amt').innerText=e;alert('Sold! $3 to ABL Total $'+e)}let s=localStorage.getItem('user');if(s)after(s);</script></body></html>
