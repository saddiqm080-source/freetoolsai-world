<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeToolsAI Studio - Real Like Canva + ChatGPT + CapCut</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head><body class="bg-[#0e0e0e] text-white min-h-screen flex flex-col"><header class="h-14 bg-[#1a1a1a] border-b border-zinc-800 flex items-center justify-between px-4 sticky top-0 z-50"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-gradient-to-br from-violet-600 to-pink-600 rounded-lg flex items-center justify-center font-black">F</div><b>FreeToolsAI Studio</b><span class="hidden md:block text-[9px] bg-white text-black px-2 py-1 rounded-full font-bold ml-2">REAL v3.0</span></div><a href="https://github.com/saddiqm080-source/freetoolsai-world" class="bg-white text-black px-4 py-1.5 rounded-full text-xs font-black">STUDIO</a></header><div class="flex flex-1"><div class="w-[68px] md:w-[200px] bg-[#1a1a1a] border-r border-zinc-800 p-2 flex flex-col gap-1"><button onclick="tab('design')" id="b-design" class="bg-white text-black rounded-xl p-3 flex items-center gap-3 font-bold text-sm"><i class="fas fa-palette"></i><span class="hidden md:block">Canva Studio</span></button><button onclick="tab('chat')" id="b-chat" class="hover:bg-[#2a2a2a] rounded-xl p-3 flex items-center gap-3 text-sm"><i class="fas fa-robot"></i><span class="hidden md:block">ChatGPT</span></button><button onclick="tab('video')" id="b-video" class="hover:bg-[#2a2a2a] rounded-xl p-3 flex items-center gap-3 text-sm"><i class="fas fa-video"></i><span class="hidden md:block">CapCut Video</span></button><button onclick="tab('yt')" id="b-yt" class="hover:bg-[#2a2a2a] rounded-xl p-3 flex items-center gap-3 text-sm"><i class="fab fa-youtube text-red-500"></i><span class="hidden md:block">YouTube</span></button><div class="mt-auto hidden md:block bg-[#2a2a2a] rounded-xl p-3 text-center"><p class="text-[10px] text-zinc-400">Raast ID</p><p class="font-mono font-bold text-green-400">03018041644</p></div></div><div class="flex-1 overflow-y-auto p-3 md:p-6 bg-[#0e0e0e]"><div id="t-design" class="tool"><h1 class="text-3xl md:text-5xl font-black">What will you<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-500 to-pink-500">design today?</span></h1><div class="mt-6 bg-[#1e1e1e] border border-zinc-700 rounded-[20px] p-3 flex gap-2 shadow-2xl"><input id="pDesign" placeholder="e.g. YouTube thumbnail Mr Beast style, logo for pizza shop, cartoon cat" class="flex-1 bg-black border border-zinc-700 rounded-full px-5 py-4 text-sm outline-none"><button onclick="gen('design')" class="bg-gradient-to-r from-violet-600 to-pink-600 w-14 h-14 rounded-full shrink-0 font-black">↑<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6"><div onclick="quick('YouTube thumbnail Mr Beast colorful bold')" class="bg-[#1e1e1e] border border-zinc-800 rounded-2xl p-3 cursor-pointer hover:border-white"><div class="h-24 bg-gradient-to-r from-red-500 to-orange-500 rounded-xl flex items-center justify-center font-black">YT</div><p class="text-xs font-bold mt-2">YouTube Thumb</p></div><div onclick="quick('Instagram post for biryani shop')" class="bg-[#1e1e1e] border border-zinc-800 rounded-2xl p-3 cursor-pointer hover:border-white"><div class="h-24 bg-gradient-to-r from-pink-500 to-violet-500 rounded-xl flex items-center justify-center font-black">IG</div><p class="text-xs font-bold mt-2">Instagram Post</p></div><div onclick="quick('Minimalist logo for tech company vector')" class="bg-[#1e1e1e] border border-zinc-800 rounded-2xl p-3 cursor-pointer hover:border-white"><div class="h-24 bg-black rounded-xl flex items-center justify-center font-black border border-zinc-700">LOGO</div><p class="text-xs font-bold mt-2">Logo Design</p></div><div onclick="quick('Cute cartoon 3d pixar character')" class="bg-[#1e1e1e] border border-zinc-800 rounded-2xl p-3 cursor-pointer hover:border-white"><div class="h-24 bg-gradient-to-r from-blue-400 to-cyan-400 rounded-xl flex items-center justify-center font-black">TOON</div><p class="text-xs font-bold mt-2">Cartoon 3D</p></div></div><div id="rDesign" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6"></div></div><div id="t-chat" class="tool hidden flex flex-col h-[75vh]"><div id="chatBox" class="flex-1 overflow-y-auto space-y-3 p-2"><div class="flex gap-2"><div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-xs">🤖</div><div class="bg-[#1e1e1e] rounded-2xl p-3 text-sm max-w-[85%]">Hello! I'm ChatGPT inside your website! Ask me to make logo, cartoon, video - I will create! Try: "Make pizza logo"</div></div></div><div class="flex gap-2 mt-3"><input id="chatIn" placeholder="Ask ChatGPT..." class="flex-1 bg-[#1e1e1e] border border-zinc-700 rounded-full px-5 py-4 text-sm outline-none" onkeypress="if(event.key==='Enter')chat()"><button onclick="chat()" class="bg-white text-black w-12 h-12 rounded-full">↑</button></div></div><div id="t-video" class="tool hidden"><h2 class="text-2xl font-black">CapCut Video Studio</h2><input id="pVideo" placeholder="Video idea: cat dancing, car drift, vlog intro" class="w-full mt-4 bg-[#1e1e1e] border border-zinc-700 rounded-full px-5 py-4 text-sm outline-none"><button onclick="gen('video')" class="w-full mt-3 bg-pink-600 p-4 rounded-full font-black">🎬 Generate Video Frame</button><div id="rVideo" class="mt-4"></div></div><div id="t-yt" class="tool hidden"><h2 class="text-2xl font-black">YouTube Thumbnail Maker</h2><input id="pYT" placeholder="Thumbnail idea: I WON $10000! Shocked face" class="w-full mt-4 bg-[#1e1e1e] border border-zinc-700 rounded-full px-5 py-4 text-sm outline-none"><button onclick="gen('yt')" class="w-full mt-3 bg-red-600 p-4 rounded-full font-black">🔥 Create Viral Thumbnail</button><div id="rYT" class="mt-4"></div></div></div></div></div><script>function tab(n){document.querySelectorAll('.tool').forEach(t=>t.classList.add('hidden'));document.getElementById('t-'+n).classList.remove('hidden');document.querySelectorAll('[id^=b-]').forEach(b=>{b.classList.remove('bg-white','text-black');b.classList.add('hover:bg-[#2a2a2a]')});document.getElementById('b-'+n).classList.add('bg-white','text-black')}function quick(t){document.getElementById('pDesign').value=t;gen('design')}function gen(type){let p='',r='';if(type=='design'){p=document.getElementById('pDesign').value;r='rDesign'}if(type=='video'){p=document.getElementById('pVideo').value;r='rVideo'}if(type=='yt'){p=document.getElementById('pYT').value;r='rYT'}if(!p){alert('Write something');return}const seed=Math.floor(Math.random()*9999999);let fp=p;if(type=='design')fp+=' high quality 4k design';if(type=='video')fp+=' cinematic video frame 4k';if(type=='yt')fp+=' youtube thumbnail viral bold mr beast colorful';const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(fp)}?width=1024&height=1024&seed=${seed}&model=turbo&nologo=true&nofeed=true&private=true`;document.getElementById(r).innerHTML=`<div class="bg-black border border-zinc-700 rounded-2xl overflow-hidden"><img src="${url}" class="w-full"><div class="p-3 flex gap-2"><a href="${url}" target="_blank" class="flex-1 bg-white text-black text-center py-3 rounded-full font-bold text-sm">Download HD</a><button onclick="gen('${type}')" class="flex-1 bg-[#2a2a2a] py-3 rounded-full text-sm">New</button></div></div>`+document.getElementById(r).innerHTML}async function chat(){const i=document.getElementById('chatIn');const t=i.value.trim();if(!t)return;const b=document.getElementById('chatBox');b.innerHTML+=`<div class="flex gap-2 justify-end"><div class="bg-white text-black rounded-2xl p-3 text-sm max-w-[80%]">${t}</div></div>`;i.value='';b.innerHTML+=`<div id="typ" class="flex gap-2"><div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-xs">🤖</div><div class="bg-[#1e1e1e] rounded-2xl p-3 text-sm text-zinc-400">Typing...</div></div>`;b.scrollTop=b.scrollHeight;try{const res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(t)}?model=openai`);const d=await res.text();document.getElementById('typ').remove();b.innerHTML+=`<div class="flex gap-2"><div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-xs">🤖</div><div class="bg-[#1e1e1e] rounded-2xl p-3 text-sm max-w-[80%]">${d.substring(0,500)}<br><button onclick="document.getElementById('pDesign').value='${t}';tab('design');gen('design')" class="mt-2 bg-violet-600 px-3 py-1 rounded-full text-xs">🎨 Create Design</button></div></div>`}catch(e){document.getElementById('typ').remove();b.innerHTML+=`<div class="flex gap-2"><div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-xs">🤖</div><div class="bg-[#1e1e1e] rounded-2xl p-3 text-sm">I can make "${t}" - Go to Canva Studio and generate FREE!</div></div>`}b.scrollTop=b.scrollHeight}</script></body></html>
