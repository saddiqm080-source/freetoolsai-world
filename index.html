<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeToolsAI Studio - Real</title><script src="https://cdn.tailwindcss.com"></script><style>*{box-sizing:border-box}body{margin:0;background:#0e0e0e;color:white;font-family:system-ui}</style></head><body class="flex flex-col h-screen"><div class="h-12 bg-[#1a1a1a] border-b border-zinc-800 flex items-center justify-between px-3"><div class="flex items-center gap-2"><div class="w-7 h-7 bg-gradient-to-r from-violet-600 to-pink-600 rounded flex items-center justify-center font-black text-sm">F</div><b class="text-sm">FreeToolsAI Studio</b></div><a href="#" class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold">STUDIO</a></div><div class="flex flex-1 overflow-hidden"><div class="w-14 bg-[#1a1a1a] border-r border-zinc-800 flex flex-col items-center py-2 gap-3"><button onclick="tab('d')" id="bd" class="w-10 h-10 bg-white text-black rounded-xl flex items-center justify-center text-sm">🎨</button><button onclick="tab('c')" id="bc" class="w-10 h-10 bg-zinc-800 rounded-xl flex items-center justify-center text-sm">🤖</button><button onclick="tab('v')" id="bv" class="w-10 h-10 bg-zinc-800 rounded-xl flex items-center justify-center text-sm">🎬</button><button onclick="tab('y')" id="by" class="w-10 h-10 bg-zinc-800 rounded-xl flex items-center justify-center text-sm">▶️</button></div><div class="flex-1 overflow-y-auto p-3"><div id="td" class="tool"><h1 class="text-2xl font-black leading-tight">What will you<br><span style="background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;color:transparent">design today?</span></h1><div class="mt-4 bg-[#1e1e1e] border border-zinc-700 rounded-2xl p-2 flex gap-2"><input id="pd" placeholder="YouTube thumbnail, logo, cartoon..." class="flex-1 bg-black border border-zinc-700 rounded-full px-4 py-3 text-sm outline-none"><button onclick="gen('d')" class="bg-gradient-to-r from-violet-600 to-pink-600 w-12 h-12 rounded-full shrink-0">↑</button></div><div class="grid grid-cols-2 gap-2 mt-4"><div onclick="q('YouTube thumbnail Mr Beast colorful')" class="bg-[#1e1e1e] border border-zinc-800 rounded-xl p-2"><div class="h-16 bg-gradient-to-r from-red-500 to-orange-500 rounded-lg flex items-center justify-center font-black text-sm">YT</div><p class="text-xs font-bold mt-1">YouTube</p></div><div onclick="q('Instagram post biryani shop')" class="bg-[#1e1e1e] border border-zinc-800 rounded-xl p-2"><div class="h-16 bg-gradient-to-r from-pink-500 to-violet-500 rounded-lg flex items-center justify-center font-black text-sm">IG</div><p class="text-xs font-bold mt-1">Instagram</p></div><div onclick="q('Minimalist logo tech vector')" class="bg-[#1e1e1e] border border-zinc-800 rounded-xl p-2"><div class="h-16 bg-black border border-zinc-700 rounded-lg flex items-center justify-center font-black text-sm">LOGO</div><p class="text-xs font-bold mt-1">Logo</p></div><div onclick="q('Cute cartoon pixar 3d')" class="bg-[#1e1e1e] border border-zinc-800 rounded-xl p-2"><div class="h-16 bg-gradient-to-r from-blue-400 to-cyan-400 rounded-lg flex items-center justify-center font-black text-sm">TOON</div><p class="text-xs font-bold mt-1">Cartoon</p></div></div><div id="rd" class="mt-4 space-y-3"></div></div><div id="tc" class="tool hidden"><div id="cb" class="space-y-2"><div class="bg-[#1e1e1e] rounded-2xl p-3 text-sm">🤖 Hello! I'm ChatGPT inside your site! Ask: Make pizza logo</div></div><div class="flex gap-2 mt-3"><input id="ci" placeholder="Ask ChatGPT..." class="flex-1 bg-[#1e1e1e] border border-zinc-700 rounded-full px-4 py-3 text-sm outline-none" onkeypress="if(event.key==='Enter')chat()"><button onclick="chat()" class="bg-white text-black w-12 h-12 rounded-full">↑</button></div></div><div id="tv" class="tool hidden"><h2 class="font-black">CapCut Studio</h2><input id="pv" placeholder="Video idea..." class="w-full mt-2 bg-[#1e1e1e] border border-zinc-700 rounded-full px-4 py-3 text-sm outline-none"><button onclick="gen('v')" class="w-full mt-2 bg-pink-600 p-3 rounded-full font-bold text-sm">Generate Video</button><div id="rv" class="mt-3"></div></div><div id="ty" class="tool hidden"><h2 class="font-black">YouTube Thumbnail</h2><input id="py" placeholder="Thumbnail idea..." class="w-full mt-2 bg-[#1e1e1e] border border-zinc-700 rounded-full px-4 py-3 text-sm outline-none"><button onclick="gen('y')" class="w-full mt-2 bg-red-600 p-3 rounded-full font-bold text-sm">Create Thumbnail</button><div id="ry" class="mt-3"></div></div></div></div></div><script>function tab(n){document.querySelectorAll('.tool').forEach(t=>t.classList.add('hidden'));document.getElementById('t'+n).classList.remove('hidden');document.querySelectorAll('[id^=b]').forEach(b=>b.className='w-10 h-10 bg-zinc-800 rounded-xl flex items-center justify-center text-sm');document.getElementById('b'+n).className='w-10 h-10 bg-white text-black rounded-xl flex items-center justify-center text-sm'}function q(t){document.getElementById('pd').value=t;gen('d')}function gen(t){let p='',r='';if(t=='d'){p=document.getElementById('pd').value;r='rd'}if(t=='v'){p=document.getElementById('pv').value;r='rv'}if(t=='y'){p=document.getElementById('py').value;r='ry'}if(!p){alert('Write idea');return}const s=Math.floor(Math.random()*999999);let f=p;if(t=='d')f+=' 4k design';if(t=='v')f+=' cinematic video';if(t=='y')f+=' youtube thumbnail viral';const u=`https://image.pollinations.ai/prompt/${encodeURIComponent(f)}?width=1024&height=1024&seed=${s}&model=turbo&nologo=true&private=true`;document.getElementById(r).innerHTML=`<div class="bg-black border border-zinc-700 rounded-xl overflow-hidden"><img src="${u}" class="w-full"><div class="p-2 flex gap-2"><a href="${u}" target="_blank" class="flex-1 bg-white text-black text-center py-2 rounded-full text-xs font-bold">Download HD</a><button onclick="gen('${t}')" class="flex-1 bg-zinc-800 py-2 rounded-full text-xs">New</button></div></div>`+document.getElementById(r).innerHTML}async function chat(){const i=document.getElementById('ci');const t=i.value.trim();if(!t)return;const b=document.getElementById('cb');b.innerHTML+=`<div class="flex justify-end"><div class="bg-white text-black rounded-2xl p-2 text-sm max-w-[80%]">${t}</div></div>`;i.value='';b.innerHTML+=`<div id="typi" class="bg-[#1e1e1e] rounded-2xl p-2 text-sm text-zinc-400">Typing...</div>`;try{const r=await fetch(`https://text.pollinations.ai/${encodeURIComponent(t)}?model=openai`);const d=await r.text();document.getElementById('typi').remove();b.innerHTML+=`<div class="bg-[#1e1e1e] rounded-2xl p-2 text-sm max-w-[90%]">${d.substring(0,400)}<br><button onclick="document.getElementById('pd').value='${t}';tab('d');gen('d')" class="mt-1 bg-violet-600 px-2 py-1 rounded-full text-xs">Create Design</button></div>`}catch(e){document.getElementById('typi').remove();b.innerHTML+=`<div class="bg-[#1e1e1e] rounded-2xl p-2 text-sm">Go to design tab to create "${t}" FREE!</div>`}}</script></body></html>
